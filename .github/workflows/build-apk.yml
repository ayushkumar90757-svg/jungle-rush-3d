name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Game
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Stage APK
        run: |
          mkdir -p output
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/JungleRush3D-v1.0.0.apk
            echo "Successfully staged APK at output/JungleRush3D-v1.0.0.apk"
          else
            echo "ERROR: APK not found!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JungleRush3D-Android-APK
          path: output/JungleRush3D-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: Jungle Rush 3D - Android APK (v1.0.0)
          body: |
            ## 🌴 Jungle Rush 3D - Official Android Release

            Download and install the complete, polished 3D endless runner game on your Android phone!

            ### Game Highlights:
            - **Original 3D Jungle Environment**: Stone ruins, narrow rope bridges over gorges, torches, and moving palm trees.
            - **Smooth 3-Lane Navigation**: Swipe left, right, jump over low logs/spikes, and slide under high archways/fire jets.
            - **3 Playable Runners**: Dash Drake, Maya Shadow (+20% magnet bonus), Captain Rex (+3s shield).
            - **4 Power-Ups**: Coin Magnet, Relic Shield, Jungle Sprint Boost, 2x Multiplier.
            - **Procedural Tribal Audio Engine**: Real-time synthesized Djembe percussion, congas, marimbas, and Foley SFX.
            - **Missions & 7-Day Rewards**: Local storage saved progress.
            - **Performance Optimized**: 60 FPS target for budget and flagship Android devices.

            ### Installation Instructions:
            1. Download **`JungleRush3D-v1.0.0.apk`** below.
            2. Open the downloaded file on your Android device.
            3. When prompted, tap **Settings** and allow **Install from this source**.
            4. Tap **Install** and enjoy running in the jungle!
          files: output/JungleRush3D-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
